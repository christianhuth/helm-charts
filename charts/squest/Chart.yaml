apiVersion: v2
name: squest
description: Squest is a self-service portal that works on top of Red Hat Ansible Automation Platform/AWX.
type: application
version: 7.1.0
appVersion: "1.31.8-alpine"
home: https://github.com/christianhuth/helm-charts
icon: https://raw.githubusercontent.com/christianhuth/helm-charts/refs/heads/main/charts/squest/icon.svg
maintainers:
  - name: christianhuth
    email: christian@knell.it
sources:
  - https://github.com/HewlettPackard/squest
  - https://hewlettpackard.github.io/squest
dependencies:
  - name: mariadb-cluster
    alias: mariadb
    repository: oci://ghcr.io/mariadb-operator/charts
    version: 26.10.2
    condition: mariadb.enabled
  - name: rabbitmq
    repository: oci://registry-1.docker.io/cloudpirates
    version: 0.21.32
    condition: rabbitmq.enabled
  - name: valkey
    repository: https://valkey.io/valkey-helm/
    version: 0.12.0
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: support for deployment strategy (squest.deploymentStrategy, celery.worker.deploymentStrategy and celery.beat.deploymentStrategy)
    - kind: changed
      description: the Celery beat deployment uses the update strategy Recreate by default, so that two schedulers never run at the same time
    - kind: deprecated
      description: squest.strategy, use squest.deploymentStrategy instead
  artifacthub.io/links: |
    - name: support
      url: https://github.com/christianhuth/helm-charts/issues
  artifacthub.io/signKey: |
    fingerprint: EE24F8BB6D099E78FD704F83B5ECDBCDDD485D0E
    url: https://charts.christianhuth.de/public.key
