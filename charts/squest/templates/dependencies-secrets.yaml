{{- if and (not .Values.mariadb.enabled) .Values.externalDatabase.password (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "squest.database.secretName" . }}
  labels:
    {{- include "squest.common.labels" . | nindent 4 }}
data:
  {{ include "squest.database.passwordKey" . }}: {{ .Values.externalDatabase.password | b64enc }}
{{- end }}
{{- if and (not .Values.rabbitmq.enabled) .Values.externalRabbitmq.password (not .Values.externalRabbitmq.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "squest.rabbitmq.secretName" . }}
  labels:
    {{- include "squest.common.labels" . | nindent 4 }}
data:
  {{ include "squest.rabbitmq.passwordKey" . }}: {{ .Values.externalRabbitmq.password | b64enc }}
{{- end }}
{{- if and (not .Values.valkey.enabled) .Values.externalRedis.password (not .Values.externalRedis.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "squest.redis.secretName" . }}
  labels:
    {{- include "squest.common.labels" . | nindent 4 }}
data:
  {{ include "squest.redis.passwordKey" . }}: {{ .Values.externalRedis.password | b64enc }}
{{- end }}
