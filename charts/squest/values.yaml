# -- Provide a name in place of `squest`
nameOverride: ""

# -- String to fully override `"squest.fullname"`
fullnameOverride: ""

# -- If defined, uses a Secret to pull an image from a private Docker registry or repository.
imagePullSecrets: []

squest:

  image:
    # -- image registry
    registry: quay.io
    # -- image repository
    repository: hewlettpackardenterprise/squest
    # -- image pull policy
    pullPolicy: Always
    # -- Overrides the image tag
    tag: "2.8.4"

  # -- Deprecated, use `squest.deploymentStrategy` instead. Update strategy type of the Squest deployment (`Recreate` or `RollingUpdate`), used if `squest.deploymentStrategy` is empty.
  strategy: Recreate

  # -- Update strategy for the Squest deployment. Falls back to `squest.strategy` if empty. Set `type: Recreate` if the persistence uses `ReadWriteOnce` volumes, as a rolling update starts the new Pod before stopping the old one and it can't mount the volume on another node.
  deploymentStrategy: {}
    # type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 25%
    #   maxUnavailable: 25%

  # -- Number of replicas
  replicaCount: 1

  # -- The number of old ReplicaSets to retain
  revisionHistoryLimit: 10

  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # -- Annotations to be added to pods
  podAnnotations: {}

  # -- Labels to be added to pods
  podLabels: {}

  # @schema
  # required: false
  # @schema
  # -- pod-level security context
  podSecurityContext:
    # @schema
    # required: false
    # @schema
    fsGroup: 999

  # -- container-level security context
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Kubernetes port where service is exposed
    port: 8080

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  # BETA: Configure the gateway routes for the chart here.
  # More routes can be added by adding a dictionary key like the 'main' route.
  # Being BETA this can/will change in the future without notice, do not use unless you want to take that risk
  # [[ref]](https://gateway-api.sigs.k8s.io/references/spec/#gateway.networking.k8s.io%2fv1alpha2)
  route:
    main:
      # -- Enables or disables the route
      enabled: false

      # -- Set the route apiVersion, e.g. gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1alpha2
      apiVersion: gateway.networking.k8s.io/v1

      # -- Set the route kind
      # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
      kind: HTTPRoute

      # -- Add annotations to the route
      annotations: {}

      # -- Add labels to the route
      labels: {}

      # -- Hostnames to be matched
      hostnames: []
      # - my-filter.example.com

      # -- Parent references (Gateway)
      parentRefs: []
      # - name: acme-gw

      # -- define conditions used for matching the rule against incoming HTTP requests.
      # @default -- see [values.yaml](./values.yaml)
      matches:
        - path:
            type: PathPrefix
            value: /

      # -- Filters define the filters that are applied to requests that match this rule.
      filters: []

      # -- Additional custom rules that can be added to the route
      additionalRules: []

      # -- adds a filter for redirecting to https (HTTP 301 Moved Permanently). To redirect HTTP traffic to HTTPS, you need to have a Gateway with both HTTP and HTTPS listeners. Matches and filters do not take effect if enabled. Ref. https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
      httpsRedirect: false

      # -- defines the timeouts that can be configured for an HTTP request
      timeouts: {}

  # -- Resource limits and requests for the pods.
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # -- Node labels for pod assignment
  nodeSelector: {}

  # -- Toleration labels for pod assignment
  tolerations: []

  # -- Affinity settings for pod assignment
  affinity: {}

  # -- additional volumes to be added to the squest pods
  extraVolumes: []

  # -- additional volumeMounts to be added to the squest container (nginx and init container have separate extraVolumeMounts)
  extraVolumeMounts: []

  # -- additional environment variables to be added to the squest container. See https://hewlettpackard.github.io/squest/latest/configuration/squest_settings for a complete list of available environment variables.
  extraEnv: []

  # -- load additional environment variables in the squest container from configMaps or secrets. See https://hewlettpackard.github.io/squest/latest/configuration/squest_settings for a complete list of available environment variables.
  extraEnvFrom: []

  config:
    django:
      # -- Django DEBUG mode.
      debug: false
      # -- Number of workers used by Gunicorn process in charge of serving client connection. Increase the number of worker threads to serve more clients concurrently
      gunicornWorkers: 4
    localization:
      # -- Change the format of all date in Squest UI. Based on Python strftime. See https://strftime.org for a strftime cheatsheet.
      dateFormat: "%d %b, %Y %H:%M"
      # -- Django language. See https://docs.djangoproject.com/en/4.2/ref/settings/#language-code for details.
      language: en-us
      # -- Time zone of the server that host Squest service. See https://docs.djangoproject.com/en/4.2/ref/settings/#std:setting-TIME_ZONE for details.
      timezone: Europe/Berlin
    plugins:
      # -- Path to form field validation modules. It is deprecated. Please use squest.config.plugins.surveyValidatorPath instead.
      fieldValidatorPath: ""
      # -- Path to SurveyValidator modules.
      surveyValidatorPath: "plugins/survey_validators"
    smtp:
      auth:
        # -- Use existing secret for password details (`squest.config.smtp.auth.password` will be ignored and picked up from this secret). The secret has to contain the key `smtp-password`.
        existingSecret: ""
        # -- The password credential to be used when using an external SMTP host.
        password: ""
        # -- The username credential to be used when using an external SMTP host.
        username: ""
      # -- Domain name used as email sender.
      from: "squest@squest.domain.local"
      # -- The SMTP host to use for sending email.
      host: "localhost"
      # -- Port to use for the SMTP server defined in squest.config.email.host.
      port: 25
      # -- Whether to use an implicit TLS (secure) connection when talking to the SMTP server defined in squest.config.smtp.host.
      useSsl: false
    squest:
      # -- A list of all the email who get code error notifications when squest.config.django.debug=false
      admins: ""
      # -- Set to True to enable email notifications. The default is based on the squest.config.django.debug value.
      emailNotificationEnabled: ""
      # -- Address of the Squest portal instance. Used in email templates and in metadata sent to Red Hat Ansible Automation Platform/AWX job templates.
      host: "http://squest.domain.local"
      # -- Set to True to change the navbar and footer color to visually identify a testing instance of Squest.
      isDevServer: false
      # -- When enabled, only administrators can access squest UI and API. This can be used for example to block new requests by end users from the service catalog. So an administrator can perform operations against the API like migrating instance specs.
      maintenanceModeEnabled: false

  nginx:

    image:
      # -- image registry
      registry: docker.io
      # -- image repository
      repository: nginx
      # -- image pull policy
      pullPolicy: Always
      # -- Overrides the image tag
      tag: "1.31.8-alpine"

    # -- additional environment variables to be added to the nginx container.
    extraEnv: []

    # -- load additional environment variables in the nginx container from configMaps or secrets.
    extraEnvFrom: []

    # -- additional volumeMounts to be added to the nginx container
    extraVolumeMounts: []

  init:

    # -- additional environment variables to be added to the init container.
    extraEnv: []

    # -- load additional environment variables in the init container from configMaps or secrets.
    extraEnvFrom: []

    # -- additional volumeMounts to be added to the init container
    extraVolumeMounts: []

celery:

  beat:

    image:
      # -- image registry
      registry: quay.io
      # -- image repository
      repository: hewlettpackardenterprise/squest
      # -- image pull policy
      pullPolicy: Always
      # -- Overrides the image tag
      tag: "2.8.4"

    # -- Number of replicas
    replicaCount: 1

    # -- The number of old ReplicaSets to retain
    revisionHistoryLimit: 10

    serviceAccount:
      # -- Specifies whether a service account should be created
      create: true
      # -- Annotations to add to the service account
      annotations: {}
      # -- The name of the service account to use
      # If not set and create is true, a name is generated using the fullname template
      name: ""

    # -- Annotations to be added to pods
    podAnnotations: {}

    # -- Labels to be added to pods
    podLabels: {}

    # -- pod-level security context
    podSecurityContext: {}
      # fsGroup: 2000

    # -- container-level security context
    securityContext: {}
      # capabilities:
      #   drop:
      #   - ALL
      # readOnlyRootFilesystem: true
      # runAsNonRoot: true
      # runAsUser: 1000

    service:
      # -- Kubernetes service type
      type: ClusterIP
      # -- Kubernetes port where service is exposed
      port: 8080

    # -- Resource limits and requests for the pods.
    resources: {}
      # We usually recommend not to specify default resources and to leave this as a conscious
      # choice for the user. This also increases chances charts run on environments with little
      # resources, such as Minikube. If you do want to specify resources, uncomment the following
      # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 100m
      #   memory: 128Mi

    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80

    # -- Update strategy for the Celery beat deployment. Defaults to `Recreate`, so that two schedulers never run at the same time.
    deploymentStrategy:
      type: Recreate

    # -- Node labels for pod assignment
    nodeSelector: {}

    # -- Toleration labels for pod assignment
    tolerations: []

    # -- Affinity settings for pod assignment
    affinity: {}

    # -- additional volumes to be added to the pods
    extraVolumes: []

    # -- additional volumeMounts to be added to the pods
    extraVolumeMounts: []

    # -- additional environment variables to be added to the pods. See https://hewlettpackard.github.io/squest/latest/configuration/squest_settings for a complete list.
    extraEnv: []

    config:
      django:
        # -- Django DEBUG mode.
        debug: false
        # -- Number of workers used by Gunicorn process in charge of serving client connection. Increase the number of worker threads to serve more clients concurrently
        gunicornWorkers: 4

  worker:

    image:
      # -- image registry
      registry: quay.io
      # -- image repository
      repository: hewlettpackardenterprise/squest
      # -- image pull policy
      pullPolicy: Always
      # -- Overrides the image tag
      tag: "2.8.4"

    # -- Number of replicas
    replicaCount: 1

    # -- The number of old ReplicaSets to retain
    revisionHistoryLimit: 10

    serviceAccount:
      # -- Specifies whether a service account should be created
      create: true
      # -- Annotations to add to the service account
      annotations: {}
      # -- The name of the service account to use
      # If not set and create is true, a name is generated using the fullname template
      name: ""

    # -- Annotations to be added to pods
    podAnnotations: {}

    # -- Labels to be added to pods
    podLabels: {}

    # -- pod-level security context
    podSecurityContext: {}
      # fsGroup: 2000

    # -- container-level security context
    securityContext: {}
      # capabilities:
      #   drop:
      #   - ALL
      # readOnlyRootFilesystem: true
      # runAsNonRoot: true
      # runAsUser: 1000

    service:
      # -- Kubernetes service type
      type: ClusterIP
      # -- Kubernetes port where service is exposed
      port: 8080

    # -- Resource limits and requests for the pods.
    resources: {}
      # We usually recommend not to specify default resources and to leave this as a conscious
      # choice for the user. This also increases chances charts run on environments with little
      # resources, such as Minikube. If you do want to specify resources, uncomment the following
      # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 100m
      #   memory: 128Mi

    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80

    # -- Update strategy for the Celery worker deployment
    deploymentStrategy: {}
      # type: RollingUpdate
      # rollingUpdate:
      #   maxSurge: 25%
      #   maxUnavailable: 25%

    # -- Node labels for pod assignment
    nodeSelector: {}

    # -- Toleration labels for pod assignment
    tolerations: []

    # -- Affinity settings for pod assignment
    affinity: {}

    # -- additional volumes to be added to the pods
    extraVolumes: []

    # -- additional volumeMounts to be added to the pods
    extraVolumeMounts: []

    # -- additional environment variables to be added to the pods. See https://hewlettpackard.github.io/squest/latest/configuration/squest_settings for a complete list.
    extraEnv: []

    config:
      django:
        # -- Django DEBUG mode.
        debug: false
        # -- Number of workers used by Gunicorn process in charge of serving client connection. Increase the number of worker threads to serve more clients concurrently
        gunicornWorkers: 4

mariadb:
  # -- Enable a MariaDB instance managed by the mariadb-operator. Requires the operator to be installed in the cluster (see README).
  enabled: true
  mariadb:
    # -- MariaDB image. The tag only pins the release series (12.3 is the current long-term support release), so restarted instances get its latest patch version.
    image: mariadb:12.3
    # -- Pull the image on every start to get the latest patch version of the release series
    imagePullPolicy: Always
    updateStrategy:
      # -- Run `mariadb-upgrade` on start, so that changing the release series in `image` migrates the system schema. It is a no-op if there is nothing to migrate.
      mariadbAutoUpgradeEnabled: true
    # -- Number of MariaDB instances. More than one instance requires Galera or replication.
    replicas: 3
    galera:
      # -- Enable Galera to run multiple instances
      enabled: true
    # -- Name of the database to create
    database: squest
    # -- Name of the user to create
    username: squest
    passwordSecretKeyRef:
      # -- Name of an existing Secret containing the password of the user. If empty, the Secret `<release>-mariadb-password` is used.
      name: ""
      # -- Key of the password inside the Secret
      key: password
      # -- Let the operator generate the Secret with a random password if it does not exist
      generate: true
    storage:
      # -- Size of the PVC of each instance
      size: 8Gi

rabbitmq:
  # -- Enable a RabbitMQ instance (chart cloudpirates/rabbitmq)
  enabled: true
  # -- Number of RabbitMQ instances. More than one instance requires `rabbitmq.peerDiscoveryK8sPlugin.enabled`.
  replicaCount: 3
  peerDiscoveryK8sPlugin:
    # -- Enable the Kubernetes peer discovery plugin to form a cluster of multiple instances
    enabled: true
  config:
    # -- Additional RabbitMQ configuration. Celery uses transient non-exclusive queues (remote control, events), which RabbitMQ denies by default since 4.3.
    extraConfiguration: |
      deprecated_features.permit.transient_nonexcl_queues = true
  auth:
    # -- Name of the default user, used by Squest
    username: squest
    # -- Password of the default user. A random password is generated if empty. Ignored if `rabbitmq.auth.existingSecret` is set.
    password: ""
    # -- Name of an existing Secret containing the password of the default user (and the Erlang cookie)
    existingSecret: ""
    # -- Key in the existing Secret containing the password
    existingPasswordKey: password

valkey:
  # -- Enable a Valkey instance (official chart valkey/valkey) used by Squest as cache
  enabled: true
  auth:
    # -- Enable password authentication. Squest authenticates as the user `default`.
    enabled: true
    # -- Name of an existing Secret containing the passwords of the users (key `<user>` or `aclUsers.<user>.passwordKey`). Takes precedence over inline passwords.
    usersExistingSecret: ""
    aclUsers:
      default:
        # -- ACL permissions of the user `default`
        permissions: "~* &* +@all"
        # -- Inline password of the user `default`. Use `valkey.auth.usersExistingSecret` instead for production.
        password: squest

externalDatabase:
  # -- Hostname of the external MariaDB or MySQL database. Used if `mariadb.enabled` is false.
  hostname: ""
  # -- Port of the external database
  port: 3306
  # -- Name of the database to use
  database: squest
  # -- Name of the user to use
  username: squest
  # -- Password of the user. Ignored if `externalDatabase.existingSecret` is set.
  password: ""
  # -- Name of an existing Secret containing the password of the user
  existingSecret: ""
  # -- Key in the existing Secret containing the password
  existingSecretPasswordKey: password

externalRabbitmq:
  # -- Hostname of the external RabbitMQ server. Used if `rabbitmq.enabled` is false.
  hostname: ""
  # -- AMQP port of the external RabbitMQ server
  port: 5672
  # -- Virtual host to use
  vhost: /
  # -- Name of the user to use
  username: squest
  # -- Password of the user. Ignored if `externalRabbitmq.existingSecret` is set. Must only contain URL-safe characters.
  password: ""
  # -- Name of an existing Secret containing the password. The password must only contain URL-safe characters.
  existingSecret: ""
  # -- Key in the existing Secret containing the password
  existingSecretPasswordKey: password

externalRedis:
  # -- Hostname of the external Redis or Valkey server. Used if `valkey.enabled` is false.
  hostname: ""
  # -- Port of the external server
  port: 6379
  # -- Name of the user to use
  username: default
  # -- Password of the user. Ignored if `externalRedis.existingSecret` is set. Must only contain URL-safe characters.
  password: ""
  # -- Name of an existing Secret containing the password. The password must only contain URL-safe characters.
  existingSecret: ""
  # -- Key in the existing Secret containing the password
  existingSecretPasswordKey: password
