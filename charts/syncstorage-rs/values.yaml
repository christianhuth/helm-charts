# -- Provide a name in place of `syncstorage-rs`
nameOverride: ""

# -- String to fully override `"syncstorage-rs.fullname"`
fullnameOverride: ""

# -- Number of replicas
replicaCount: 1

# -- The number of old ReplicaSets to retain
revisionHistoryLimit: 0

image:
  # -- image registry
  registry: ghcr.io
  # -- image repository. Mozilla publishes one image per database type: `mozilla-services/syncstorage-rs/syncserver-mysql` for MariaDB and MySQL, `mozilla-services/syncstorage-rs/syncserver-postgres` for PostgreSQL. Both are only available for `linux/amd64`.
  repository: mozilla-services/syncstorage-rs/syncserver-mysql
  # -- image pull policy
  pullPolicy: Always
  # -- Overrides the image tag
  tag: "0.24.0"

# -- If defined, uses a Secret to pull an image from a private Docker registry or repository.
imagePullSecrets: []

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations to be added to exporter pods
podAnnotations: {}

# -- pod-level security context
podSecurityContext: {}
  # fsGroup: 2000

# -- container-level security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- Kubernetes service type
  type: ClusterIP
  # -- Kubernetes port where service is exposed
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# BETA: Configure the gateway routes for the chart here.
# More routes can be added by adding a dictionary key like the 'main' route.
# Being BETA this can/will change in the future without notice, do not use unless you want to take that risk
# [[ref]](https://gateway-api.sigs.k8s.io/references/spec/#gateway.networking.k8s.io%2fv1alpha2)
route:
  main:
    # -- Enables or disables the route
    enabled: false

    # -- Set the route apiVersion, e.g. gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1alpha2
    apiVersion: gateway.networking.k8s.io/v1

    # -- Set the route kind
    # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
    kind: HTTPRoute

    # -- Add annotations to the route
    annotations: {}

    # -- Add labels to the route
    labels: {}

    # -- Hostnames to be matched
    hostnames: []
    # - my-filter.example.com

    # -- Parent references (Gateway)
    parentRefs: []
    # - name: acme-gw

    # -- define conditions used for matching the rule against incoming HTTP requests.
    # @default -- see [values.yaml](./values.yaml)
    matches:
      - path:
          type: PathPrefix
          value: /

    # -- Filters define the filters that are applied to requests that match this rule.
    filters: []

    # -- Additional custom rules that can be added to the route
    additionalRules: []

    # -- adds a filter for redirecting to https (HTTP 301 Moved Permanently). To redirect HTTP traffic to HTTPS, you need to have a Gateway with both HTTP and HTTPS listeners. Matches and filters do not take effect if enabled. Ref. https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
    httpsRedirect: false

    # -- defines the timeouts that can be configured for an HTTP request
    timeouts: {}

# -- Resource limits and requests for the controller pods.
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

livenessProbe:
  # -- Enable the livenessProbe. It uses `/__lbheartbeat__`, which does not check the databases.
  enabled: true
  # -- Failure threshold for livenessProbe
  failureThreshold: 6
  # -- Initial delay seconds for livenessProbe
  initialDelaySeconds: 10
  # -- Period seconds for livenessProbe
  periodSeconds: 10
  # -- Success threshold for livenessProbe
  successThreshold: 1
  # -- Timeout in seconds for livenessProbe
  timeoutSeconds: 2

readinessProbe:
  # -- Enable the readinessProbe. It uses `/__heartbeat__`, which also checks the databases.
  enabled: true
  # -- Failure threshold for readinessProbe
  failureThreshold: 6
  # -- Initial delay seconds for readinessProbe
  initialDelaySeconds: 10
  # -- Period seconds for readinessProbe
  periodSeconds: 10
  # -- Success threshold for readinessProbe
  successThreshold: 1
  # -- Timeout in seconds for readinessProbe
  timeoutSeconds: 2

# -- Node labels for pod assignment
nodeSelector: {}

# -- Toleration labels for pod assignment
tolerations: []

# -- Affinity settings for pod assignment
affinity: {}

# -- additional environment variables to be added to the pods
extraEnv: []

syncstorage:
  config:
    # -- host to listen for connections
    host: "0.0.0.0"
    # -- The minimum Rust error logging level. Valid values: debug, info, warn, error.
    logLevel: info
    # -- connection port
    port: 8000
    # -- run migrations for the tokenserver database
    runTokenserverDbMigrations: true
    # -- Public URL of the sync server, scheme and host (e.g. `https://sync.example.com`). syncstorage-rs registers it as storage node in the Tokenserver database on startup and the clients sync against it. Defaults to the first host of the Ingress (`https` if it has TLS) or of the HTTPRoute (`https`).
    publicUrl: ""
    # -- Maximum number of accounts the storage node (`publicUrl`) accepts. Only used when syncstorage-rs creates the node, see [Limiting the number of users](#limiting-the-number-of-users).
    nodeCapacity: 100000
    # -- Allow new accounts to register. When disabled, only accounts that already synced with this server can use it.
    allowNewUsers: true
    fxa:
      # -- Email domain of the Mozilla accounts environment the clients log in to
      emailDomain: api.accounts.firefox.com
      # -- OAuth server of the Mozilla accounts environment, used to verify the tokens of the clients
      oauthServerUrl: https://oauth.accounts.firefox.com
  masterKey:
    # -- Use existing secret for the sync master key (`syncstorage.masterKey.value` will be ignored and picked up from this secret). The secret has to contain the key `master-key`.
    existingSecret: ""
    # -- The sync master key value. Required if `syncstorage.masterKey.existingSecret` is not set.
    value: ""

syncserver-db:
  # -- Enable a MariaDB instance managed by the mariadb-operator for the Syncserver database. Requires the operator to be installed in the cluster (see README). Disable it if `postgresql.enabled` is true.
  enabled: true
  mariadb:
    # -- MariaDB image. The tag only pins the release series (12.3 is the current long-term support release), so restarted instances get its latest patch version.
    image: mariadb:12.3
    # -- Pull the image on every start to get the latest patch version of the release series
    imagePullPolicy: Always
    updateStrategy:
      # -- Run `mariadb-upgrade` on start, so that changing the release series in `image` migrates the system schema. It is a no-op if there is nothing to migrate.
      mariadbAutoUpgradeEnabled: true
    # -- Number of MariaDB instances. More than one instance requires Galera or replication.
    replicas: 3
    galera:
      # -- Enable Galera to run multiple instances
      enabled: true
    # -- Name of the database to create
    database: syncserver
    # -- Name of the user to create
    username: syncserver
    passwordSecretKeyRef:
      # -- Name of an existing Secret containing the password of the user. If empty, the Secret `<release>-syncserver-db-password` is used.
      name: ""
      # -- Key of the password inside the Secret
      key: password
      # -- Let the operator generate the Secret with a random password if it does not exist
      generate: true
    storage:
      # -- Size of the PVC of each instance
      size: 8Gi
    connection:
      secretTemplate:
        # -- Key of the connection URL inside the Secret `<release>-syncserver-db` generated by the operator
        key: database-url
        # -- Format of the connection URL used by syncstorage-rs. The password is URL-encoded.
        format: "mysql://{{ .Username }}:{{ urlquery .Password }}@{{ .Host }}:{{ .Port }}/{{ .Database }}"

tokenserver-db:
  # -- Enable a MariaDB instance managed by the mariadb-operator for the Tokenserver database. Requires the operator to be installed in the cluster (see README). Disable it if `postgresql.enabled` is true.
  enabled: true
  mariadb:
    # -- MariaDB image. The tag only pins the release series (12.3 is the current long-term support release), so restarted instances get its latest patch version.
    image: mariadb:12.3
    # -- Pull the image on every start to get the latest patch version of the release series
    imagePullPolicy: Always
    updateStrategy:
      # -- Run `mariadb-upgrade` on start, so that changing the release series in `image` migrates the system schema. It is a no-op if there is nothing to migrate.
      mariadbAutoUpgradeEnabled: true
    # -- Number of MariaDB instances. More than one instance requires Galera or replication.
    replicas: 3
    galera:
      # -- Enable Galera to run multiple instances
      enabled: true
    # -- Name of the database to create
    database: tokenserver
    # -- Name of the user to create
    username: tokenserver
    passwordSecretKeyRef:
      # -- Name of an existing Secret containing the password of the user. If empty, the Secret `<release>-tokenserver-db-password` is used.
      name: ""
      # -- Key of the password inside the Secret
      key: password
      # -- Let the operator generate the Secret with a random password if it does not exist
      generate: true
    storage:
      # -- Size of the PVC of each instance
      size: 8Gi
    connection:
      secretTemplate:
        # -- Key of the connection URL inside the Secret `<release>-tokenserver-db` generated by the operator
        key: database-url
        # -- Format of the connection URL used by syncstorage-rs. The password is URL-encoded.
        format: "mysql://{{ .Username }}:{{ urlquery .Password }}@{{ .Host }}:{{ .Port }}/{{ .Database }}"

postgresql:
  # -- Enable a PostgreSQL cluster managed by the CloudNativePG operator for the Syncserver and the Tokenserver database, which share one database (like in the setup of Mozilla). Requires the operator to be installed in the cluster and the image `mozilla-services/syncstorage-rs/syncserver-postgres` (see README).
  enabled: false
  version:
    # -- PostgreSQL major version. Has to match the major version of `postgresql.cluster.imageName`.
    postgresql: "18"
  cluster:
    # -- PostgreSQL image. The tag only pins the major version, so restarted instances get the latest minor version.
    imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
    # -- Pull the image on every start to get the latest minor version of the major version
    imagePullPolicy: Always
    # -- Number of PostgreSQL instances (one primary, the others are replicas)
    instances: 3
    initdb:
      # -- Name of the database to create
      database: syncserver
      # -- Name of the user owning the database
      owner: syncserver
      # Use an existing Secret of type `kubernetes.io/basic-auth` (keys `username` and `password`) for the owner.
      # If not set, the operator generates the Secret `<release>-postgresql-app`. The password must only contain URL-safe characters.
      # secret:
      #   name: ""
    storage:
      # -- Size of the PVC of each instance
      size: 8Gi

externalSyncserverDatabase:
  # -- Type of the external Syncserver database: `mysql` (MariaDB or MySQL) or `postgres`. Has to match the type of the Tokenserver database and the image.
  type: mysql
  # -- Hostname of the external Syncserver database. Used if neither `syncserver-db.enabled` nor `postgresql.enabled` is true.
  hostname: ""
  # @schema
  # type: [string, integer]
  # @schema
  # -- Port of the external Syncserver database. Defaults to 3306 for `mysql` and 5432 for `postgres`.
  port: ""
  # -- Name of the database to use
  database: syncserver
  # -- Name of the user to use
  username: syncserver
  # -- Password of the user. Ignored if `externalSyncserverDatabase.existingSecret` is set. Must only contain URL-safe characters.
  password: ""
  # -- Name of an existing Secret containing the password of the user. The password must only contain URL-safe characters.
  existingSecret: ""
  # -- Key in the existing Secret containing the password of the user
  existingSecretPasswordKey: password

externalTokenserverDatabase:
  # -- Type of the external Tokenserver database: `mysql` (MariaDB or MySQL) or `postgres`. Has to match the type of the Syncserver database and the image.
  type: mysql
  # -- Hostname of the external Tokenserver database. Used if neither `tokenserver-db.enabled` nor `postgresql.enabled` is true. It may be the same database as the Syncserver database.
  hostname: ""
  # @schema
  # type: [string, integer]
  # @schema
  # -- Port of the external Tokenserver database. Defaults to 3306 for `mysql` and 5432 for `postgres`.
  port: ""
  # -- Name of the database to use
  database: tokenserver
  # -- Name of the user to use
  username: tokenserver
  # -- Password of the user. Ignored if `externalTokenserverDatabase.existingSecret` is set. Must only contain URL-safe characters.
  password: ""
  # -- Name of an existing Secret containing the password of the user. The password must only contain URL-safe characters.
  existingSecret: ""
  # -- Key in the existing Secret containing the password of the user
  existingSecretPasswordKey: password
