{{- range $name := list "syncserver" "tokenserver" }}
{{- $ctx := dict "root" $ "name" $name }}
{{- $external := include "syncstorage-rs.database.external" $ctx | fromYaml }}
{{- if and (not (include "syncstorage-rs.database.bundled" $ctx)) (not (include "syncstorage-rs.database.postgresql" $ctx)) (not $external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncstorage-rs.database.secretName" $ctx }}
  labels:
    {{- include "syncstorage-rs.labels" $ | nindent 4 }}
data:
  {{ include "syncstorage-rs.database.passwordKey" $ctx }}: {{ required (printf "external%sDatabase.password or external%sDatabase.existingSecret is required if neither %s-db.enabled nor postgresql.enabled is true" (title $name) (title $name) $name) $external.password | b64enc }}
{{- end }}
{{- end }}
