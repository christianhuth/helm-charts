{{- include "syncstorage-rs.database.validate" . }}
{{- include "syncstorage-rs.masterKey.validate" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "syncstorage-rs.labels" . | nindent 4 }}
  name: {{ include "syncstorage-rs.fullname" . }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | int }}
  {{- with .Values.deploymentStrategy }}
  strategy:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "syncstorage-rs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "syncstorage-rs.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "syncstorage-rs.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RUST_LOG
              value: {{ .Values.syncstorage.config.logLevel | quote }}
            - name: SYNC_HOST
              value: {{ .Values.syncstorage.config.host | quote }}
            - name: SYNC_PORT
              value: {{ .Values.syncstorage.config.port | quote }}
            - name: SYNC_MASTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncstorage-rs.masterKey.secretName" . }}
                  key: {{ include "syncstorage-rs.masterKey.secretKey" . }}
            # Syncserver DB Settings
            {{- include "syncstorage-rs.database.urlEnv" (dict "root" . "name" "syncserver" "env" "SYNC_SYNCSTORAGE__DATABASE_URL") | nindent 12 }}
            # Tokenserver DB Settings
            - name: SYNC_TOKENSERVER__ENABLED
              value: "true"
            - name: SYNC_TOKENSERVER__NODE_TYPE
              value: {{ include "syncstorage-rs.database.type" (dict "root" . "name" "tokenserver") | quote }}
            {{- include "syncstorage-rs.database.urlEnv" (dict "root" . "name" "tokenserver" "env" "SYNC_TOKENSERVER__DATABASE_URL") | nindent 12 }}
            - name: SYNC_TOKENSERVER__RUN_MIGRATIONS
              value: {{ .Values.syncstorage.config.runTokenserverDbMigrations | quote }}
            # Tokenserver Settings
            {{- with include "syncstorage-rs.publicUrl" . }}
            - name: SYNC_TOKENSERVER__INIT_NODE_URL
              value: {{ . | quote }}
            - name: SYNC_TOKENSERVER__INIT_NODE_CAPACITY
              value: {{ $.Values.syncstorage.config.nodeCapacity | int | quote }}
            {{- end }}
            - name: SYNC_TOKENSERVER__ALLOW_NEW_USERS
              value: {{ .Values.syncstorage.config.allowNewUsers | quote }}
            - name: SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN
              value: {{ .Values.syncstorage.config.fxa.emailDomain | quote }}
            - name: SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL
              value: {{ .Values.syncstorage.config.fxa.oauthServerUrl | quote }}
            {{- if .Values.extraEnv }}
              # Additional Settings
              {{ .Values.extraEnv | toYaml | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.syncstorage.config.port | int }}
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /__lbheartbeat__
              port: http
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | int }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | int }}
            successThreshold: {{ .Values.livenessProbe.successThreshold | int }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | int }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /__heartbeat__
              port: http
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | int }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | int }}
            successThreshold: {{ .Values.readinessProbe.successThreshold | int }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | int }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
