{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "headwind-mdm.database.secretName" . }}
  labels:
    {{- include "headwind-mdm.labels" . | nindent 4 }}
data:
  {{ include "headwind-mdm.database.passwordKey" . }}: {{ required "externalDatabase.password or externalDatabase.existingSecret is required if postgresql.enabled is false" .Values.externalDatabase.password | b64enc }}
{{- end }}
