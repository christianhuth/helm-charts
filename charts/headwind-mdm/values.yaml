# -- Provide a name in place of `headwind-mdm`
nameOverride: ""
# -- String to fully override `"headwind-mdm.fullname"`
fullnameOverride: ""

image:
  # -- image registry
  registry: docker.io
  # -- image repository
  repository: headwindmdm/hmdm
  # -- image pull policy
  pullPolicy: Always
  # -- Overrides the image tag
  tag: "0.1.9"

# -- If defined, uses a Secret to pull an image from a private Docker registry or repository.
imagePullSecrets: []

# -- Number of replicas
replicaCount: 1

# -- The number of old ReplicaSets to retain
revisionHistoryLimit: 10

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations to be added to exporter pods
podAnnotations: {} # +doc-gen:ignore

# -- pod-level security context
podSecurityContext: {}
  # fsGroup: 2000

# -- container-level security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- Kubernetes service type
  type: ClusterIP
  # -- Kubernetes port where service is exposed
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- ip to resolve public uri behind reverse proxy
  ip: ""
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# BETA: Configure the gateway routes for the chart here.
# More routes can be added by adding a dictionary key like the 'main' route.
# Being BETA this can/will change in the future without notice, do not use unless you want to take that risk
# [[ref]](https://gateway-api.sigs.k8s.io/references/spec/#gateway.networking.k8s.io%2fv1alpha2)
route:
  main:
    # -- Enables or disables the route
    enabled: false

    # -- Set the route apiVersion, e.g. gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1alpha2
    apiVersion: gateway.networking.k8s.io/v1

    # -- Set the route kind
    # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
    kind: HTTPRoute

    # -- Add annotations to the route
    annotations: {}

    # -- Add labels to the route
    labels: {}

    # -- Hostnames to be matched
    hostnames: []
    # - my-filter.example.com

    # -- Parent references (Gateway)
    parentRefs: []
    # - name: acme-gw

    # -- define conditions used for matching the rule against incoming HTTP requests.
    # @default -- see [values.yaml](./values.yaml)
    matches:
      - path:
          type: PathPrefix
          value: /

    # -- Filters define the filters that are applied to requests that match this rule.
    filters: []

    # -- Additional custom rules that can be added to the route
    additionalRules: []

    # -- adds a filter for redirecting to https (HTTP 301 Moved Permanently). To redirect HTTP traffic to HTTPS, you need to have a Gateway with both HTTP and HTTPS listeners. Matches and filters do not take effect if enabled. Ref. https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
    httpsRedirect: false

    # -- defines the timeouts that can be configured for an HTTP request
    timeouts: {}

# -- Resource limits and requests for the headwind pods.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Update strategy for the deployment. Set `type: Recreate` if the persistence uses `ReadWriteOnce` volumes, as a rolling update starts the new Pod before stopping the old one and it can't mount the volume on another node.
deploymentStrategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

# -- Node labels for pod assignment
nodeSelector: {}

# -- Toleration labels for pod assignment
tolerations: []

# -- Affinity settings for pod assignment
affinity: {}

headwind:
  # -- Email of admin user
  adminEmail: ""
  # -- URL under which Headwind will be available
  baseDomain: ""
  # @ignored
  clientVersion: "5.14"
  # @ignored
  downloadCredentials: ""
  # -- Subsequent starts of the container skip this step, but you can force the renewal of the configuration
  forceReconfigure: false
  # @ignored
  hmdmUrl: "https://h-mdm.com/files/hmdm-5.12.1-os.war"
  # @ignored
  hmdmVariant: "os"
  # -- Available values: en, ru (en by default)
  installLanguage: "en"
  sharedSecret:
    # -- An existing secret that contains the shared secret for a premium setup. If this is provided `headwind.sharedSecret.secretValue` is ignored. Key needs to be `shared-secret``.
    existingSecret: ""
    # -- The shared secret for a premium setup. Ignored if `headwind.sharedSecret.existingSecret` is provided.
    secretValue: ""

persistence:
  enabled: false
  annotations: {}
  accessModes:
    - ReadWriteOnce
  existingClaim: ""
  storageClass: ""
  size: 10Gi

postgresql:
  # -- Enable a PostgreSQL cluster managed by the CloudNativePG operator. Requires the operator to be installed in the cluster (see README).
  enabled: true
  version:
    # -- PostgreSQL major version. Has to match the major version of `postgresql.cluster.imageName`.
    postgresql: "18"
  cluster:
    # -- PostgreSQL image. The tag only pins the major version, so restarted instances get the latest minor version.
    imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
    # -- Pull the image on every start to get the latest minor version of the major version
    imagePullPolicy: Always
    # -- Number of PostgreSQL instances (one primary, the others are replicas)
    instances: 3
    initdb:
      # -- Name of the database to create
      database: hmdm
      # -- Name of the user owning the database
      owner: hmdm
      # Use an existing Secret of type `kubernetes.io/basic-auth` (keys `username` and `password`) for the owner.
      # If not set, the operator generates the Secret `<release>-postgresql-app`.
      # secret:
      #   name: ""
    storage:
      # -- Size of the PVC of each instance
      size: 8Gi

externalDatabase:
  # -- Hostname of the external PostgreSQL database. Used if `postgresql.enabled` is false.
  hostname: ""
  # -- Port of the external PostgreSQL database
  port: 5432
  # -- Name of the database to use
  database: hmdm
  # -- Name of the user to use
  username: hmdm
  # -- Password of the user. Ignored if `externalDatabase.existingSecret` is set.
  password: ""
  # -- Name of an existing Secret containing the password of the user
  existingSecret: ""
  # -- Key in the existing Secret containing the password of the user
  existingSecretPasswordKey: password
