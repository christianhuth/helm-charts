{{- if and (not (eq (include "shlink-backend.database.driver" .) "sqlite")) (not .Values.postgresql.enabled) (not .Values.mariadb.enabled) (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shlink-backend.database.secretName" . }}
  labels:
    {{- include "shlink-backend.labels" . | nindent 4 }}
data:
  {{ include "shlink-backend.database.passwordKey" . }}: {{ required "externalDatabase.password or externalDatabase.existingSecret is required for an external database" .Values.externalDatabase.password | b64enc }}
{{- end }}
{{- if and (not .Values.rabbitmq.enabled) .Values.externalRabbitmq.hostname (not .Values.externalRabbitmq.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shlink-backend.rabbitmq.secretName" . }}
  labels:
    {{- include "shlink-backend.labels" . | nindent 4 }}
data:
  {{ include "shlink-backend.rabbitmq.passwordKey" . }}: {{ required "externalRabbitmq.password or externalRabbitmq.existingSecret is required for an external RabbitMQ server" .Values.externalRabbitmq.password | b64enc }}
{{- end }}
{{- if and (not .Values.valkey.enabled) .Values.externalRedis.hostname .Values.externalRedis.password (not .Values.externalRedis.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shlink-backend.redis.secretName" . }}
  labels:
    {{- include "shlink-backend.labels" . | nindent 4 }}
data:
  {{ include "shlink-backend.redis.passwordKey" . }}: {{ .Values.externalRedis.password | b64enc }}
{{- end }}
