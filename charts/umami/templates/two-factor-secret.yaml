{{- if and .Values.umami.twoFactor.encryptionKey (not .Values.umami.twoFactor.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "umami.twoFactor.secretName" . }}
  labels:
    {{- include "umami.labels" . | nindent 4 }}
data:
  {{ include "umami.twoFactor.secretKey" . }}: {{ .Values.umami.twoFactor.encryptionKey | b64enc }}
{{- end }}
