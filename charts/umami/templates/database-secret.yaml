{{- if and (not .Values.database.existingSecret) (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "umami.database.secretName" . }}
  labels:
    {{- include "umami.labels" . | nindent 4 }}
data:
  {{ include "umami.database.passwordKey" . }}: {{ required "externalDatabase.password or externalDatabase.existingSecret is required if postgresql.enabled is false" .Values.externalDatabase.password | b64enc }}
{{- end }}
