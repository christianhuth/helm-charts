{{- if not .Values.umami.appSecret.existingSecret -}}
{{- $secretName := include "umami.appSecret.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "umami.labels" . | nindent 4 }}
data:
  {{- if .Values.umami.appSecret.secret }}
  app-secret: {{ .Values.umami.appSecret.secret | b64enc }}
  {{- else if (index $existing "app-secret") }}
  {{- /* keep the generated secret across upgrades, otherwise all sessions are invalidated */}}
  app-secret: {{ index $existing "app-secret" }}
  {{- else }}
  app-secret: {{ randAlphaNum 50 | b64enc }}
  {{- end }}
{{- end }}
