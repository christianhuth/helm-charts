apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "umami.fullname" . }}
  labels:
    {{- include "umami.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.deploymentStrategy }}
  strategy:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "umami.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "umami.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "umami.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Database Settings
            {{- include "umami.database.env" . | nindent 12 }}
            # Umami Settings
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "umami.appSecret.secretName" . | quote }}
                  key: app-secret
            {{- if .Values.umami.clientIpHeader }}
            - name: CLIENT_IP_HEADER
              value: {{ .Values.umami.clientIpHeader | quote }}
            {{- end }}
            {{- if (eq .Values.umami.cloudMode "1") }}
            - name: CLOUD_MODE
              value: {{ .Values.umami.cloudMode | quote }}
            {{- end }}
            {{- if .Values.umami.collectApiEndpoint }}
            - name: COLLECT_API_ENDPOINT
              value: {{ .Values.umami.collectApiEndpoint | quote }}
            {{- end }}
            {{- if .Values.umami.debug }}
            - name: DEBUG
              value: {{ .Values.umami.debug | quote }}
            {{- end }}
            {{- if .Values.umami.corsMaxAge }}
            - name: CORS_MAX_AGE
              value: {{ .Values.umami.corsMaxAge | quote }}
            {{- end }}
            {{- if .Values.umami.disableBotCheck }}
            - name: DISABLE_BOT_CHECK
              value: {{ .Values.umami.disableBotCheck | quote }}
            {{- end }}
            {{- if not .Values.umami.removeDisableLoginEnv }}
            - name: DISABLE_LOGIN
              value: {{ .Values.umami.disableLogin | quote }}
            {{- end }}
            - name: DISABLE_TELEMETRY
              value: {{ .Values.umami.disableTelemetry | quote }}
            - name: DISABLE_UPDATES
              value: {{ .Values.umami.disableUpdates | quote }}
            {{- if eq (toString .Values.umami.enableTestConsole) "1" }}
            - name: ENABLE_TEST_CONSOLE
              value: "1"
            {{- end }}
            - name: FORCE_SSL
              value: {{ .Values.umami.forceSSL | quote }}
            {{- if .Values.umami.hostname }}
            - name: HOSTNAME
              value: {{ .Values.umami.hostname | quote }}
            {{- end }}
            {{- if .Values.umami.ignoredIpAddresses }}
            - name: IGNORE_IP
              value: {{ .Values.umami.ignoredIpAddresses | quote }}
            {{- end }}
            {{- if .Values.umami.logQuery }}
            - name: LOG_QUERY
              value: {{ .Values.umami.logQuery | quote }}
            {{- end }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: REMOVE_TRAILING_SLASH
              value: {{ .Values.umami.removeTrailingSlash | quote }}
            - name: TRACKER_SCRIPT_NAME
              value: {{ .Values.umami.trackerScriptName | quote }}
            # Settings introduced with Umami v3
            {{- if .Values.umami.linksUrl }}
            - name: LINKS_URL
              value: {{ .Values.umami.linksUrl | quote }}
            {{- end }}
            {{- if eq (toString .Values.umami.mcpEnabled) "1" }}
            - name: MCP_ENABLED
              value: "1"
            {{- end }}
            {{- if .Values.umami.pixelsUrl }}
            - name: PIXELS_URL
              value: {{ .Values.umami.pixelsUrl | quote }}
            {{- end }}
            {{- if .Values.umami.saltRotation }}
            - name: SALT_ROTATION
              value: {{ .Values.umami.saltRotation | quote }}
            {{- end }}
            {{- if or .Values.umami.twoFactor.encryptionKey .Values.umami.twoFactor.existingSecret }}
            - name: TWO_FACTOR_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "umami.twoFactor.secretName" . | quote }}
                  key: {{ include "umami.twoFactor.secretKey" . | quote }}
            {{- end }}
            {{- if eq (toString .Values.umami.useUuidV7) "1" }}
            - name: USE_UUIDV7
              value: "1"
            {{- end }}
            # Extra environment variables
            {{- range .Values.extraEnv }}
            {{- if and (.name) (.value) }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | int }}
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path | quote}}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | int }}
            successThreshold: {{ .Values.livenessProbe.successThreshold | int }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | int }}
          readinessProbe:
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | int }}
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path | quote}}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | int }}
            successThreshold: {{ .Values.readinessProbe.successThreshold | int }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | int }}
          startupProbe:
            failureThreshold: {{ .Values.startupProbe.failureThreshold | int }}
            httpGet:
              path: {{ .Values.startupProbe.httpGet.path | quote}}
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds | int }}
            successThreshold: {{ .Values.startupProbe.successThreshold | int }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds | int }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.umami.customScript.enabled }}
          volumeMounts:
            - name: custom-script
              mountPath: {{ .Values.umami.customScript.mountPath | quote }}
              subPath: {{ .Values.umami.customScript.key | quote }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.umami.customScript.enabled }}
      volumes:
        - name: custom-script
          configMap:
            name: {{ include "umami.fullname" . }}
      {{- end }}
