# -- Provide a name in place of `umami`
nameOverride: ""

# -- String to fully override `"umami.fullname"`
fullnameOverride: ""

image:
  # -- image registry
  registry: ghcr.io
  # -- image repository
  repository: umami-software/umami
  # -- image pull policy
  pullPolicy: Always
  # -- Overrides the image tag
  tag: "3.4.1"

# -- If defined, uses a Secret to pull an image from a private Docker registry or repository.
imagePullSecrets: []

# -- Annotations to be added to pods
podAnnotations: {}

# -- Labels to be added to pods
podLabels: {}

# -- pod-level security context
podSecurityContext: {}
  # fsGroup: 2000

# -- Number of replicas
replicaCount: 1

# -- The number of old ReplicaSets to retain
revisionHistoryLimit: 10

# -- Resource limits and requests for the controller pods.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- container-level security context
securityContext:
  runAsGroup: 65533
  runAsNonRoot: true
  runAsUser: 1001

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

service:
  # -- Kubernetes service type
  type: ClusterIP
  # -- Kubernetes port where service is exposed
  port: 3000

ingress:
  # -- Enable ingress record generation
  enabled: false
  # -- IngressClass that will be be used to implement the Ingress
  className: ""
  # -- Additional annotations for the Ingress resource
  annotations: {}
    # cert-manager.io/cluster-issuer: cluster-issuer-name
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- An array with hosts and paths
  # @default -- see [values.yaml](./values.yaml)
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- An array with the tls configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# BETA: Configure the gateway routes for the chart here.
# More routes can be added by adding a dictionary key like the 'main' route.
# Being BETA this can/will change in the future without notice, do not use unless you want to take that risk
# [[ref]](https://gateway-api.sigs.k8s.io/references/spec/#gateway.networking.k8s.io%2fv1alpha2)
route:
  main:
    # -- Enables or disables the route
    enabled: false

    # -- Set the route apiVersion, e.g. gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1alpha2
    apiVersion: gateway.networking.k8s.io/v1

    # -- Set the route kind
    # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
    kind: HTTPRoute

    # -- Add annotations to the route
    annotations: {}

    # -- Add labels to the route
    labels: {}

    # -- Hostnames to be matched
    hostnames: []
    # - my-filter.example.com

    # -- Parent references (Gateway)
    parentRefs: []
    # - name: acme-gw

    # -- define conditions used for matching the rule against incoming HTTP requests.
    # @default -- see [values.yaml](./values.yaml)
    matches:
      - path:
          type: PathPrefix
          value: /

    # -- Filters define the filters that are applied to requests that match this rule.
    filters: []

    # -- Additional custom rules that can be added to the route
    additionalRules: []

    # -- adds a filter for redirecting to https (HTTP 301 Moved Permanently). To redirect HTTP traffic to HTTPS, you need to have a Gateway with both HTTP and HTTPS listeners. Matches and filters do not take effect if enabled. Ref. https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
    httpsRedirect: false

    # -- defines the timeouts that can be configured for an HTTP request
    timeouts: {}

autoscaling:
  # -- Enable Horizontal POD autoscaling
  enabled: false
  # -- Minimum number of replicas
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 100
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # -- Target Memory utilization percentage
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  # -- Failure threshold for livenessProbe
  failureThreshold: 3
  httpGet:
    # -- Path for livenessProbe
    path: "/"
  # -- Initial delay seconds for livenessProbe
  initialDelaySeconds: 15
  # -- Period seconds for livenessProbe
  periodSeconds: 10
  # -- Success threshold for livenessProbe
  successThreshold: 1
  # -- Timeout seconds for livenessProbe
  timeoutSeconds: 1

readinessProbe:
  # -- Failure threshold for readinessProbe
  failureThreshold: 3
  httpGet:
    # -- Path for readinessProbe
    path: "/"
  # -- Initial delay seconds for readinessProbe
  initialDelaySeconds: 15
  # -- Period seconds for readinessProbe
  periodSeconds: 10
  # -- Success threshold for readinessProbe
  successThreshold: 1
  # -- Timeout seconds for readinessProbe
  timeoutSeconds: 1

startupProbe:
  # -- Failure threshold for startupProbe
  failureThreshold: 30
  httpGet:
    # -- Path for startupProbe
    path: "/"
  # -- Initial delay seconds for startupProbe
  initialDelaySeconds: 30
  # -- Period seconds for startupProbe
  periodSeconds: 10
  # -- Success threshold for startupProbe
  successThreshold: 1
  # -- Timeout seconds for startupProbe
  timeoutSeconds: 1

# -- Update strategy for the deployment
deploymentStrategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

# -- Node labels for pod assignment
nodeSelector: {}

# -- Toleration labels for pod assignment
tolerations: []

# -- Affinity settings for pod assignment
affinity: {}

# -- additional environment variables to be added to the pods. See https://umami.is/docs/environment-variables for a complete list of available variables. Most variables can be set under umami as well.
extraEnv: []

# -- define additional init containers
initContainers: {}

umami:
  appSecret:
    # -- Name of an existing secret containing the app secret under the key app-secret.
    existingSecret: ""
    # -- A random string used to generate unique values.
    secret: ""
  # -- HTTP header to check for the client's IP address. This is useful when you're behind a proxy that uses non-standard headers.
  clientIpHeader: ""
  # -- Disables users, teams, and websites settings page.
  cloudMode: "0"
  # -- Allows you to send metrics to a location different than the default `/api/send`. This is to help you avoid some ad-blockers.
  collectApiEndpoint: ""
  # -- How many seconds a CORS preflight should last. Default is 24 hours.
  corsMaxAge: "86400"
  customScript:
    # -- Create and mount a ConfigMap with a custom script
    enabled: false
    # -- The custom script
    data: ""
    # -- Key in the ConfigMap
    key: "script.js"
    # -- The path to mount the custom script to
    mountPath: "/app/public/script.js"
  # -- Console logging for specific areas of the application (`DEBUG`). Values include `umami:auth`, `umami:clickhouse`, `umami:kafka`, `umami:middleware`, and `umami:prisma`.
  debug: ""
  # -- By default bots are excluded from statistics. This disables checking for bots.
  disableBotCheck: "1"
  # -- Disables the login page for the application
  disableLogin: "1"
  # -- Umami collects completely anonymous telemetry data in order help improve the application. You can choose to disable this if you don't want to participate.
  disableTelemetry: "1"
  # -- Disables the check for new versions of Umami
  disableUpdates: "1"
  # -- Set to "1" to enable the internal test page, {host}/console. Admin access is required. Users can manually fire pageviews and events to their websites.
  enableTestConsole: "0"
  # -- This will redirect all requests from http to https in the Umami application. Note, this does not apply to the tracking script.
  forceSSL: "1"
  # -- hostname under which Umami will be reached
  hostname: "0.0.0.0"
  # -- You can provide a comma-delimited list of IP address to exclude from data collection.
  ignoredIpAddresses: ""
  # -- If you are running in development mode, this will log database queries to the console for debugging.
  logQuery: "1"
  # -- Set to "1" to enable the MCP endpoint (`/mcp`) for AI assistants
  mcpEnabled: ""
  # -- URL of the links feature (short links), e.g. https://links.example.com
  linksUrl: ""
  # -- URL of the pixels feature (tracking pixels), e.g. https://pixels.example.com
  pixelsUrl: ""
  # -- Rotation period of the salt used to anonymize sessions, e.g. `day` or `month`. Defaults to `month`.
  saltRotation: ""
  twoFactor:
    # -- 64 hexadecimal characters (256-bit key) to encrypt the two-factor authentication secrets, e.g. generated with `openssl rand -hex 32`. Two-factor authentication is unavailable without a key. Ignored if `umami.twoFactor.existingSecret` is set.
    encryptionKey: ""
    # -- Name of an existing Secret containing the key
    existingSecret: ""
    # -- Key in the existing Secret containing the key
    existingSecretKey: two-factor-encryption-key
  # -- Set to "1" to use UUIDv7 instead of UUIDv4 for new IDs
  useUuidV7: ""
  # -- setting this to true removes the environment variable DISABLE_LOGIN defined in `umami.disableLogin` from the deployment as this caused errors in some setups
  removeDisableLoginEnv: true
  # -- Removes the trailing slash from all incoming urls.
  removeTrailingSlash: "1"
  # -- Allows you to assign a custom name to the tracker script different from the default umami. This is to help you avoid some ad-blockers.
  trackerScriptName: "umami"

postgresql:
  # -- Enable a PostgreSQL cluster managed by the CloudNativePG operator. Requires the operator to be installed in the cluster (see README).
  enabled: true
  version:
    # -- PostgreSQL major version. Has to match the major version of `postgresql.cluster.imageName`.
    postgresql: "18"
  cluster:
    # -- PostgreSQL image. The tag only pins the major version, so restarted instances get the latest minor version.
    imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
    # -- Pull the image on every start to get the latest minor version of the major version
    imagePullPolicy: Always
    # -- Number of PostgreSQL instances (one primary, the others are replicas)
    instances: 3
    initdb:
      # -- Name of the database to create
      database: umami
      # -- Name of the user owning the database
      owner: umami
      # Use an existing Secret of type `kubernetes.io/basic-auth` (keys `username` and `password`) for the owner.
      # If not set, the operator generates the Secret `<release>-postgresql-app`.
      # secret:
      #   name: ""
    storage:
      # -- Size of the PVC of each instance
      size: 8Gi

externalDatabase:
  # -- Hostname of the external PostgreSQL database. Used if `postgresql.enabled` is false.
  hostname: ""
  # -- Port of the external PostgreSQL database
  port: 5432
  # -- Name of the database to use
  database: umami
  # -- Name of the user to use
  username: umami
  # -- Password of the user. Ignored if `externalDatabase.existingSecret` is set. Must only contain URL-safe characters.
  password: ""
  # -- Name of an existing Secret containing the password of the user. The password must only contain URL-safe characters.
  existingSecret: ""
  # -- Key in the existing Secret containing the password
  existingSecretPasswordKey: password

database:
  # -- Key in the existing secret containing the database url
  databaseUrlKey: ""
  # -- Name of an existing Secret containing the complete database URL (`postgresql://...`). Takes precedence over `postgresql.*` and `externalDatabase.*`.
  existingSecret: ""
