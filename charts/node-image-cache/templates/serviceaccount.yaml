{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "node-image-cache.labels" . | nindent 4 }}
  name: {{ include "node-image-cache.serviceAccountName" . }}
automountServiceAccountToken: false
{{- end }}
