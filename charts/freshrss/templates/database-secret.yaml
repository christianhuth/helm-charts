{{- if and (include "freshrss.database.enabled" .) (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "freshrss.database.secretName" . }}
  labels:
    {{- include "freshrss.labels" . | nindent 4 }}
data:
  {{ include "freshrss.database.passwordKey" . }}: {{ required "externalDatabase.password or externalDatabase.existingSecret is required if freshrss.database.type is postgresql and postgresql.enabled is false" .Values.externalDatabase.password | b64enc }}
{{- end }}
