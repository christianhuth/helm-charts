apiVersion: v2
name: freshrss
description: FreshRSS is a free, self-hostable feed aggregator
type: application
version: 3.0.0
appVersion: "1.30.1"
home: https://github.com/christianhuth/helm-charts
icon: https://raw.githubusercontent.com/christianhuth/helm-charts/refs/heads/main/charts/freshrss/icon.svg
maintainers:
  - name: christianhuth
    email: christian@knell.it
sources:
  - https://github.com/FreshRSS/FreshRSS
  - https://freshrss.org/
dependencies:
  - name: cluster
    alias: postgresql
    repository: https://cloudnative-pg.github.io/charts
    version: 0.9.0
    condition: postgresql.enabled
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "BREAKING: replaced the Bitnami PostgreSQL subchart with a PostgreSQL cluster managed by the CloudNativePG operator (upstream chart cnpg/cluster). See the upgrade notes in the README."
    - kind: changed
      description: "BREAKING: renamed externalPostgresql to externalDatabase and flattened its auth.* keys"
    - kind: removed
      description: "BREAKING: inline password for the bundled PostgreSQL. The operator generates the password or uses the Secret given in postgresql.cluster.initdb.secret.name"
    - kind: fixed
      description: the database password is no longer rendered in plain text into FRESHRSS_INSTALL but read from its Secret
  artifacthub.io/links: |
    - name: support
      url: https://github.com/christianhuth/helm-charts/issues
  artifacthub.io/screenshots: |
    - title: FreshRSS is a self-hosted RSS and Atom feed aggregator.
      url: https://freshrss.org/images/screenshot.webp
    - title: FreshRSS natively supports basic Web scraping, based on XPath, for Web sites not providing any RSS / Atom feed. Also supports JSON documents.
      url: https://raw.githubusercontent.com/FreshRSS/FreshRSS/edge/docs/img/FreshRSS-screenshot.png
  artifacthub.io/signKey: |
    fingerprint: EE24F8BB6D099E78FD704F83B5ECDBCDDD485D0E
    url: https://charts.christianhuth.de/public.key
