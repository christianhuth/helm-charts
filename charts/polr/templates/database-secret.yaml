{{- if and (not .Values.mariadb.enabled) (not .Values.externalDatabase.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "polr.database.secretName" . }}
  labels:
    {{- include "polr.labels" . | nindent 4 }}
data:
  {{ include "polr.database.passwordKey" . }}: {{ required "externalDatabase.password or externalDatabase.existingSecret is required if mariadb.enabled is false" .Values.externalDatabase.password | b64enc }}
{{- end }}
