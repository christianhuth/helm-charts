{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kutt.database.secretName" . }}
  labels:
    {{- include "kutt.labels" . | nindent 4 }}
data:
  {{ include "kutt.database.passwordKey" . }}: {{ required "externalDatabase.password or externalDatabase.existingSecret is required if postgresql.enabled is false" .Values.externalDatabase.password | b64enc }}
{{- end }}
{{- if and (not .Values.valkey.enabled) .Values.externalRedis.hostname .Values.externalRedis.password (not .Values.externalRedis.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kutt.redis.secretName" . }}
  labels:
    {{- include "kutt.labels" . | nindent 4 }}
data:
  {{ include "kutt.redis.passwordKey" . }}: {{ .Values.externalRedis.password | b64enc }}
{{- end }}
