{{- $spec := deepCopy .Values.mongodb }}
{{- /* users without passwordSecretRef use the Secrets generated by the chart (see secrets.yaml) */}}
{{- $users := list }}
{{- range (include "mongodb-community.users" . | fromYamlArray) }}
{{- if not .passwordSecretRef }}
{{- $_ := set . "passwordSecretRef" (dict "name" (include "mongodb-community.generatedPasswordSecretName" (dict "context" $ "user" .name)) "key" "password") }}
{{- end }}
{{- /* the operator stores the SCRAM credentials in <scramCredentialsSecretName>-scram-credentials and fails without a name */}}
{{- if not .scramCredentialsSecretName }}
{{- $_ := set . "scramCredentialsSecretName" (printf "%s-%s" (include "mongodb-community.fullname" $) (.name | lower | replace "_" "-")) }}
{{- end }}
{{- $users = append $users . }}
{{- end }}
{{- $_ := set $spec "users" $users }}
{{- if and $spec.prometheus (not $spec.prometheus.passwordSecretRef) }}
{{- $_ := set $spec.prometheus "passwordSecretRef" (dict "name" (printf "%s-prometheus" (include "mongodb-community.fullname" .)) "key" "password") }}
{{- end }}
{{- /* the database pods use the ServiceAccount of this release instead of the operator's fixed default */}}
{{- with include "mongodb-community.serviceAccountName" . }}
{{- $statefulSet := dict "spec" (dict "template" (dict "spec" (dict "serviceAccountName" .))) }}
{{- $_ := set $spec "statefulSet" (mergeOverwrite $statefulSet ($spec.statefulSet | default dict)) }}
{{- end }}
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: {{ include "mongodb-community.fullname" . }}
  labels:
    {{- include "mongodb-community.labels" . | nindent 4 }}
spec:
  {{- toYaml $spec | nindent 2 }}
