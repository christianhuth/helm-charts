{{- /* passwords of users without passwordSecretRef, kept on upgrades */}}
{{- range (include "mongodb-community.users" . | fromYamlArray) }}
{{- if not .passwordSecretRef }}
{{- $name := include "mongodb-community.generatedPasswordSecretName" (dict "context" $ "user" .name) }}
{{- $existing := (lookup "v1" "Secret" $.Release.Namespace $name).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mongodb-community.labels" $ | nindent 4 }}
type: Opaque
data:
  password: {{ index $existing "password" | default (randAlphaNum 32 | b64enc) }}
{{- end }}
{{- end }}
{{- /* username (for the ServiceMonitor) and, without passwordSecretRef, password of the Prometheus endpoint */}}
{{- with .Values.mongodb.prometheus }}
{{- $name := printf "%s-prometheus" (include "mongodb-community.fullname" $) }}
{{- $existing := (lookup "v1" "Secret" $.Release.Namespace $name).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mongodb-community.labels" $ | nindent 4 }}
type: Opaque
data:
  username: {{ required "mongodb.prometheus.username is required" .username | b64enc }}
  {{- if not .passwordSecretRef }}
  password: {{ index $existing "password" | default (randAlphaNum 32 | b64enc) }}
  {{- end }}
{{- end }}
