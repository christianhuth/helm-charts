{{- if .Values.serviceMonitor.enabled }}
{{- $prometheus := required "serviceMonitor.enabled requires mongodb.prometheus" .Values.mongodb.prometheus }}
{{- $fullname := include "mongodb-community.fullname" . }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mongodb-community.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      # label of the headless Service created by the operator
      app: {{ $fullname }}-svc
  endpoints:
    - port: prometheus
      path: {{ $prometheus.metricsPath | default "/metrics" }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- if $prometheus.tlsSecretKeyRef }}
      scheme: https
      {{- with .Values.serviceMonitor.tlsConfig }}
      tlsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      basicAuth:
        username:
          name: {{ $fullname }}-prometheus
          key: username
        password:
          name: {{ dig "passwordSecretRef" "name" (printf "%s-prometheus" $fullname) $prometheus }}
          key: {{ dig "passwordSecretRef" "key" "password" $prometheus }}
{{- end }}
