{{- if and (not .Values.mariadb.enabled) (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "typo3.database.secretName" . }}
  labels:
    {{- include "typo3.labels" . | nindent 4 }}
data:
  {{ include "typo3.database.passwordKey" . }}: {{ required "externalDatabase.password or externalDatabase.existingSecret is required if mariadb.enabled is false" .Values.externalDatabase.password | b64enc }}
{{- end }}
{{- if not .Values.typo3.admin.existingSecret }}
{{- $secretName := include "typo3.admin.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "typo3.labels" . | nindent 4 }}
data:
  {{- if .Values.typo3.admin.password }}
  password: {{ .Values.typo3.admin.password | b64enc }}
  {{- else if (index $existing "password") }}
  password: {{ index $existing "password" }}
  {{- else }}
  {{- /* satisfies the default password policy of TYPO3: upper and lower case letters, digits and a special character */}}
  password: {{ printf "%s-%s%s" (randAlpha 10 | upper) (randAlpha 10 | lower) (randNumeric 4) | b64enc }}
  {{- end }}
{{- end }}
