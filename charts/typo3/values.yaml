# -- Provide a name in place of `typo3`
nameOverride: ""
# -- String to fully override `"typo3.fullname"`
fullnameOverride: ""

image:
  # -- image registry
  registry: docker.io
  # -- image repository
  repository: crinis/typo3
  # -- image pull policy
  pullPolicy: Always
  # -- Overrides the image tag
  tag: "legacy-13.4.36"

# -- If defined, uses a Secret to pull an image from a private Docker registry or repository.
imagePullSecrets: []

# -- Number of replicas
replicaCount: 1

# -- The number of old ReplicaSets to retain
revisionHistoryLimit: 10

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations to be added to exporter pods
podAnnotations: {} # +doc-gen:ignore

# -- pod-level security context. TYPO3 runs rootless as `www-data` (33) and listens on port 8080. The image expects the user to be a member of the root group (`supplementalGroups`), as `/var/www/html` belongs to it.
# @default -- see [values.yaml](./values.yaml)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 33
  runAsGroup: 33
  fsGroup: 33
  supplementalGroups:
    - 0
  seccompProfile:
    type: RuntimeDefault

# -- container-level security context
# @default -- see [values.yaml](./values.yaml)
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  # -- Kubernetes service type
  type: ClusterIP
  # -- Kubernetes port where service is exposed
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# BETA: Configure the gateway routes for the chart here.
# More routes can be added by adding a dictionary key like the 'main' route.
# Being BETA this can/will change in the future without notice, do not use unless you want to take that risk
# [[ref]](https://gateway-api.sigs.k8s.io/references/spec/#gateway.networking.k8s.io%2fv1alpha2)
route:
  main:
    # -- Enables or disables the route
    enabled: false

    # -- Set the route apiVersion, e.g. gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1alpha2
    apiVersion: gateway.networking.k8s.io/v1

    # -- Set the route kind
    # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
    kind: HTTPRoute

    # -- Add annotations to the route
    annotations: {}

    # -- Add labels to the route
    labels: {}

    # -- Hostnames to be matched
    hostnames: []
    # - my-filter.example.com

    # -- Parent references (Gateway)
    parentRefs: []
    # - name: acme-gw

    # -- define conditions used for matching the rule against incoming HTTP requests.
    # @default -- see [values.yaml](./values.yaml)
    matches:
      - path:
          type: PathPrefix
          value: /

    # -- Filters define the filters that are applied to requests that match this rule.
    filters: []

    # -- Additional custom rules that can be added to the route
    additionalRules: []

    # -- adds a filter for redirecting to https (HTTP 301 Moved Permanently). To redirect HTTP traffic to HTTPS, you need to have a Gateway with both HTTP and HTTPS listeners. Matches and filters do not take effect if enabled. Ref. https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
    httpsRedirect: false

    # -- defines the timeouts that can be configured for an HTTP request
    timeouts: {}

# -- Resource limits and requests for the headwind pods.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  # -- Failure threshold for livenessProbe
  failureThreshold: 3
  httpGet:
    # -- Path for livenessProbe
    path: "/typo3/"
  # -- Initial delay seconds for livenessProbe
  initialDelaySeconds: 0
  # -- Period seconds for livenessProbe
  periodSeconds: 10
  # -- Success threshold for livenessProbe
  successThreshold: 1
  # -- Timeout seconds for livenessProbe
  timeoutSeconds: 5

readinessProbe:
  # -- Failure threshold for readinessProbe
  failureThreshold: 3
  httpGet:
    # -- Path for readinessProbe
    path: "/typo3/"
  # -- Initial delay seconds for readinessProbe
  initialDelaySeconds: 0
  # -- Period seconds for readinessProbe
  periodSeconds: 10
  # -- Success threshold for readinessProbe
  successThreshold: 1
  # -- Timeout seconds for readinessProbe
  timeoutSeconds: 5

# Apache only starts after the initial setup (or upgrade) of TYPO3 is done, which may take several minutes
startupProbe:
  # -- Failure threshold for startupProbe
  failureThreshold: 60
  httpGet:
    # -- Path for startupProbe
    path: "/typo3/"
  # -- Initial delay seconds for startupProbe
  initialDelaySeconds: 10
  # -- Period seconds for startupProbe
  periodSeconds: 10
  # -- Success threshold for startupProbe
  successThreshold: 1
  # -- Timeout seconds for startupProbe
  timeoutSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Update strategy for the deployment
deploymentStrategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

# -- Node labels for pod assignment
nodeSelector: {}

# -- Toleration labels for pod assignment
tolerations: []

# -- Affinity settings for pod assignment
affinity: {}

persistence:
  fileadmin:
    # -- use a PVC to persist fileadmin data
    enabled: true
    # -- the desired access modes the volume should have.
    accessModes:
      - ReadWriteOnce
    # -- Annotations to be added to the PersistentVolumeClaim
    annotations: {}
    # -- provide an existing PersistentVolumeClaim
    existingClaim: ""
    # -- Name of the StorageClass required by the claim.
    storageClassName: ""
    # -- represents the minimum and maximum resources the volume should have.
    resources:
      requests:
        storage: 5Gi
  typo3conf:
    # -- use a PVC to persist typo3conf data
    enabled: true
    # -- the desired access modes the volume should have.
    accessModes:
      - ReadWriteOnce
    # -- Annotations to be added to the PersistentVolumeClaim
    annotations: {}
    # -- provide an existing PersistentVolumeClaim
    existingClaim: ""
    # -- Name of the StorageClass required by the claim.
    storageClassName: ""
    # -- represents the minimum and maximum resources the volume should have.
    resources:
      requests:
        storage: 1Gi

typo3:
  # -- TYPO3 context, `Production` or `Development`
  context: Production
  # -- Name of the TYPO3 project. Only used for the initial setup.
  projectName: "New TYPO3 Project"
  setup:
    # -- Set up TYPO3 on the first start, i.e. if `typo3conf/system/settings.php` does not exist yet (`SETUP_TYPO3`)
    enabled: true
    # -- URL of a site to create during the initial setup, e.g. `https://www.example.com/`. No site is created if empty.
    createSite: ""
  admin:
    # -- Username of the admin user created during the initial setup
    username: admin
    # -- Email address of the admin user created during the initial setup
    email: admin@example.com
    # -- Password of the admin user. It has to satisfy the password policy of TYPO3 (at least 8 characters with upper and lower case letters, a digit and a special character). A random password is generated if empty. Ignored if `typo3.admin.existingSecret` is set.
    password: ""
    # -- Name of an existing Secret containing the password of the admin user
    existingSecret: ""
    # -- Key in the existing Secret containing the password
    existingSecretPasswordKey: password
  # -- Update the database connection in `typo3conf/system/settings.php` from the chart values on every start (init container `prepare`)
  modifyConfiguration: true
  # -- Set up extensions on every start, e.g. apply database schema changes (`SETUP_EXTENSIONS`)
  setupExtensions: false
  # -- Set sensible file permissions below `/var/www/html` on every start (`FIX_FILE_PERMISSIONS`). Can take a while with many files.
  fixFilePermissions: true
  scheduler:
    # -- Run the TYPO3 scheduler every five minutes in a sidecar container
    enabled: false

mariadb:
  # -- Enable a MariaDB instance managed by the mariadb-operator. Requires the operator to be installed in the cluster (see README).
  enabled: true
  mariadb:
    # -- MariaDB image. The tag only pins the release series (13.0 is the current long-term support release), so restarted instances get its latest patch version.
    image: mariadb:13.0
    # -- Pull the image on every start to get the latest patch version of the release series
    imagePullPolicy: Always
    updateStrategy:
      # -- Run `mariadb-upgrade` on start, so that changing the release series in `image` migrates the system schema. It is a no-op if there is nothing to migrate.
      mariadbAutoUpgradeEnabled: true
    # -- Number of MariaDB instances. More than one instance requires Galera or replication.
    replicas: 3
    galera:
      # -- Enable Galera to run multiple instances
      enabled: true
    # -- Name of the database to create
    database: typo3
    # -- Name of the user to create
    username: typo3
    passwordSecretKeyRef:
      # -- Name of an existing Secret containing the password of the user. If empty, the Secret `<release>-mariadb-password` is used.
      name: ""
      # -- Key of the password inside the Secret
      key: password
      # -- Let the operator generate the Secret with a random password if it does not exist
      generate: true
    storage:
      # -- Size of the PVC of each instance
      size: 8Gi

externalDatabase:
  # -- Hostname of the external MariaDB or MySQL database. Used if `mariadb.enabled` is false.
  hostname: ""
  # -- Port of the external database
  port: 3306
  # -- Name of the database to use
  database: typo3
  # -- Name of the user to use
  username: typo3
  # -- Password of the user. Ignored if `externalDatabase.existingSecret` is set.
  password: ""
  # -- Name of an existing Secret containing the password of the user
  existingSecret: ""
  # -- Key in the existing Secret containing the password
  existingSecretPasswordKey: password
