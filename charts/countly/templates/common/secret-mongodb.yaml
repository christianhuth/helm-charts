{{- if and (not .Values.mongodb.enabled) .Values.externalMongodb.username (not .Values.externalMongodb.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "countly.mongodb.secretName" . }}
data:
  {{ include "countly.mongodb.passwordKey" . }}: {{ required "externalMongodb.password or externalMongodb.existingSecret is required if externalMongodb.username is set" .Values.externalMongodb.password | b64enc }}
{{- end }}
