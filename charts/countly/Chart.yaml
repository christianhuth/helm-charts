apiVersion: v2
name: countly
description: Countly is a product analytics platform that helps teams track, analyze and act-on their user actions and behaviour on mobile, web and desktop applications.
type: application
version: 6.0.0
appVersion: "25.05.4"
home: https://github.com/christianknell/helm-charts
icon: https://raw.githubusercontent.com/christianhuth/helm-charts/refs/heads/main/charts/countly/icon.svg
maintainers:
  - name: christianhuth
    email: christian@knell.it
sources:
  - https://github.com/Countly/countly-server
  - https://countly.com/
dependencies:
  - name: mongodb-community
    alias: mongodb
    repository: https://charts.christianhuth.de
    version: 1.0.0
    condition: mongodb.enabled
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "BREAKING: replaced the Bitnami MongoDB subchart with a replica set managed by the MongoDB Controllers for Kubernetes (chart mongodb-community). The database now requires authentication. See the upgrade notes in the README."
    - kind: changed
      description: "BREAKING: restructured externalMongodb (auth.database moved to database) and added authentication, replica set and driver options"
    - kind: added
      description: init container wait-for-mongodb, which lets the api and frontend wait for the bundled replica set instead of restarting
    - kind: fixed
      description: frontend.extraEnv is applied to the frontend instead of api.extraEnv
  artifacthub.io/links: |
    - name: support
      url: https://github.com/christianhuth/helm-charts/issues
  artifacthub.io/screenshots: |
    - title: From analytics to surveys, everything you need to build delightful customer experiences on mobile, web, and desktop. Your dedicated product analytics server awaits you.
      url: https://cdn.prod.website-files.com/61c1b7c3e2f3805325be4594/646ca75af762159d03f456f1_mycountlyhero.svg
  artifacthub.io/signKey: |
    fingerprint: EE24F8BB6D099E78FD704F83B5ECDBCDDD485D0E
    url: https://charts.christianhuth.de/public.key
