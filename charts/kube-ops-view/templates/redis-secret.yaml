{{- if and (not .Values.valkey.enabled) .Values.externalRedis.hostname .Values.externalRedis.password (not .Values.externalRedis.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-ops-view.redis.secretName" . }}
  labels:
    {{- include "kube-ops-view.labels" . | nindent 4 }}
data:
  {{ include "kube-ops-view.redis.passwordKey" . }}: {{ .Values.externalRedis.password | b64enc }}
{{- end }}
